intro: "I write web copy, long-form SEO blogs, campaign pages, press releases and social content for travel companies and agencies across North America, Singapore, the UK and Pakistan. Most of my recent work lives on seesight-tours.com, where I write the blog and the copy for every city, tour and attraction page."
results: ["180%+ organic search traffic growth at See Sight Tours", "28% lift in direct booking conversions", "100+ published travel blogs", "20 cities' web pages, Canada & USA"]
about: "I've been writing professionally since 2021: first for agencies in Singapore, the UK and Pakistan, and since October 2022 as Content Writer & Copy Strategist for See Sight Tours, a small-group tour company in 20 cities across Canada and the USA, and its sister venture Tripshepherd.\n\nMy day-to-day is SEO-led content. I research keywords, search intent and competitors in Semrush and Ubersuggest, then write the blog (more than 100 published articles), the city, tour and attraction pages, and the campaign pages, published on FireCMS and later Tripshepherd's custom CMS. I add calls to action that move readers toward booking, design campaign creatives in Figma, and set editorial standards for the interns and junior writers I manage.\n\nBefore that I wrote and audited agency websites, press releases and PR plans in Singapore, ran social media and community management for clients in the UK, and planned monthly social calendars and campaign copy for clients in Pakistan."
location: "Based in Pakistan (PKT, UTC+5). Open to remote roles."
