name: "Ammara Younas"
headline: "Content writer and copywriter"
intro: "I write SEO content, web copy and campaign copy, and I edit other writers. Since 2022 I've written for Tripshepherd (See Sight Tours), a North American tour company, where I write city guides, tour pages and blogs and lead a small team of content interns and junior writers. I'm also a published poet."
results: ["180%+ increase in organic search traffic at Tripshepherd", "28% lift in direct tour-booking conversions", "Leads a team of content interns and junior writers"]
about: "I've been writing professionally since 2021: first for agencies in Singapore and Pakistan, and since October 2022 as the content writer for Tripshepherd (See Sight Tours), working remotely with a North American team.\n\nMy day-to-day is SEO-led content. I research keywords and competitors in Semrush and Ubersuggest, write city guides, blog posts and tour product pages, run SEO audits and QA checks, and publish on FireCMS. I also write web copy and landing pages, add calls to action that move readers toward booking, and set editorial standards for the interns and junior writers I manage.\n\nBefore that I wrote press releases, email campaigns, social media content and web copy for agency clients in their own brand voices, planned monthly social calendars, and supervised designers on campaign visuals.\n\nOutside work I write poetry. My poems have appeared in Rattle, The Margins, Verse Daily and Action, Spectacle, and I edited prose and poetry for Subtext Literary Magazine."
location: "Based in Pakistan (PKT, UTC+5). Open to remote roles."
